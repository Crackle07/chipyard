# Phase 3a metasim smoke config for bounded ICL write-buffer benchmarks.
# This intentionally uses PM1725a-class TLC timing with a tiny 4-line cache
# so full-page writeback/eviction behavior completes quickly under Verilator.

fixed_policy         = false
target_clock_hz      = 1000000000

cell_type            = TLC
bits_per_cell        = 3
n_channels           = 16
n_dies_per_channel   = 4
n_planes             = 2
pages_per_block      = 1024
page_size_bytes      = 16384
bus_speed_mtps       = 533
n_meta_pages         = 8

tR_LSB_ns            = 77000
tR_CSB_ns            = 120000
tR_MSB_ns            = 140000
tPROG_LSB_ns         = 700000
tPROG_CSB_ns         = 1300000
tPROG_MSB_ns         = 2500000
tBERS_ns             = 15000000

wb_enabled           = true
wb_ack_latency_cycles = 20000
host_overhead_cycles = 4072
host_bandwidth_bps   = 3300000000
icl_capacity_bytes   = 65536
icl_line_size_bytes  = 16384
icl_eviction_policy  = lru
icl_associativity    = full
