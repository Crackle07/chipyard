# Calibration target: Samsung PM1725a (Jo 2024, MDPI Electronics 13(1):174, Table 1)
#   typical read latency:        90 us
#   max 4KB random read IOPS:    800K (4-lane PCIe variant)
#   sequential read bandwidth:   3.3 GB/s
# NAND constants: Micron 256Gb 3D TLC datasheet, stored as target cycles or ns
# Geometry chosen to satisfy aggregate IOPS target
# host_bandwidth_bps caps aggregate host egress at the published 4-lane
# sequential-read bandwidth; host_overhead_cycles then lands first-access
# 4KB LSB read at 90 us.
# ICL write buffer is bounded, fully associative LRU; read hits are still
# out of scope until Phase 3b.
# OUT OF SCOPE for this preset: mix-workload tails (need Phase 3b/4)

fixed_policy         = false
target_clock_hz      = 1000000000

cell_type            = TLC
bits_per_cell        = 3
n_channels           = 16
n_dies_per_channel   = 4
n_planes             = 2
pages_per_block      = 1024
page_size_bytes      = 16384
bus_speed_mtps       = 533
n_meta_pages         = 8

tR_LSB_ns            = 77000
tR_CSB_ns            = 120000
tR_MSB_ns            = 140000
# Micron publishes collapsed typical/max program times. The LSB/MSB split is
# estimated from SimpleSSD Fig. 3 ratios; do not treat it as a Micron table.
tPROG_LSB_ns         = 700000
tPROG_CSB_ns         = 1300000
tPROG_MSB_ns         = 2500000
tBERS_ns             = 15000000

wb_enabled           = true
wb_ack_latency_cycles = 20000
host_overhead_cycles = 4072
host_bandwidth_bps   = 3300000000
icl_capacity_bytes   = 33554432
icl_line_size_bytes  = 16384
icl_eviction_policy  = lru
icl_associativity    = full
