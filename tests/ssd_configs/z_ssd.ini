# Calibration target: Samsung SZ985 Z-SSD (Jo 2024, MDPI Electronics 13(1):174, Table 1)
#   typical read latency:        12-20 us
#   typical write latency:       16 us
#   max 4KB random read IOPS:    750K
#   sequential read bandwidth:   3.2 GB/s
# NAND constants: Samsung Z-NAND from Cheong et al., ISSCC 2018
# (cited in Amber, arXiv:1811.01544 ref [61])
# Z-NAND is binned-fast SLC behavior -- no LSB/CSB/MSB variation.
# Geometry tuned from the 8ch starting point to the 4-lane 750K / 3.2 GB/s
# target: with an 800 MT/s bus, 4 channels give ~3.2 GB/s aggregate bus rate.
# host_overhead_cycles fitted to land first-access read at 12 us.
# ICL write buffer is bounded, fully associative LRU; Z-SSD keeps a smaller
# buffer than PM1725a because it needs less latency hiding.

fixed_policy         = false
target_clock_hz      = 1000000000

cell_type            = SLC
bits_per_cell        = 1
n_channels           = 4
n_dies_per_channel   = 2
n_planes             = 2
pages_per_block      = 1024
page_size_bytes      = 16384
bus_speed_mtps       = 800
n_meta_pages         = 8

tR_LSB_ns            = 3000
tR_CSB_ns            = 3000
tR_MSB_ns            = 3000
tPROG_LSB_ns         = 100000
tPROG_CSB_ns         = 100000
tPROG_MSB_ns         = 100000
tBERS_ns             = 3000000

wb_enabled           = true
wb_ack_latency_cycles = 16000
host_overhead_cycles = 3871
host_bandwidth_bps   = 512000000000
icl_capacity_bytes   = 8388608
icl_line_size_bytes  = 16384
icl_eviction_policy  = lru
icl_associativity    = full
